/* Vinci, 01/11/2026: nas páginas de obrigado com agendador (typ-nc-cal e typ-tk-cal), tira e-mail, telefone, nome e
   CPF da URL ANTES das tags lerem a página. Os valores vão só para o agendador do HubSpot, pelo data-src do iframe, e ele
   continua preenchido. O container é mascarado na Clarity, que grava o DOM. Precisa ficar no TOPO do código do head
   do site, antes do pixel e do GTM.
   - Chaves (sem diferenciar maiúscula de minúscula): a mesma lista da régua de Disparos.
   - Um container que só entrar depois do load + 5 s abre o agendador sem preenchimento (não vaza nada).
   - Dado pessoal no #hash não é tratado: hoje o Typeform põe tudo na query.
   Para desfazer: apagar este bloco e publicar o site. */
(function () {
  try {
    if (!/^\/typ-(nc|tk)-cal\/?$/i.test(location.pathname) || !window.URLSearchParams || !window.MutationObserver || !history.replaceState) return;
    var CHAVES = ['email', 'e-mail', 'mail', 'phone', 'telefone', 'tel', 'whatsapp', 'celular', 'nome', 'name', 'firstname', 'lastname', 'cpf'];
    var q = new URLSearchParams(location.search), leva = new URLSearchParams(), tira = [];
    q.forEach(function (v, k) { if (CHAVES.indexOf(k.toLowerCase()) !== -1) { leva.append(k, v); if (tira.indexOf(k) === -1) tira.push(k); } });
    if (!tira.length) return;
    for (var t = 0; t < tira.length; t++) q['delete'](tira[t]);
    var resto = q.toString(), extra = leva.toString();
    history.replaceState(history.state, '', location.pathname + (resto ? '?' + resto : '') + location.hash);
    var varre = function () {
      var l = document.querySelectorAll('.meetings-iframe-container');
      for (var i = 0; i < l.length; i++) {
        if (l[i].getAttribute('data-inl-pii')) continue;
        var src = l[i].getAttribute('data-src') || '';
        l[i].setAttribute('data-src', src + (src.indexOf('?') === -1 ? '?' : '&') + extra);
        l[i].setAttribute('data-inl-pii', '1');
        l[i].setAttribute('data-clarity-mask', 'True');  // a Clarity grava o DOM; sem isto ela leva o src do iframe
      }
    };
    var mo = new MutationObserver(varre);
    mo.observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', varre);
    window.addEventListener('load', function () { setTimeout(function () { varre(); mo.disconnect(); }, 5000); });
  } catch (e) {}
})();
</script>
