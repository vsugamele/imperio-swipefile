/* Fallback com as MÉTRICAS da Manrope (medidas: Manrope 500 é 3,05% mais larga que a
   Arial 400 em texto pt-BR; ascent 1066/1000, descent 300/1000): a troca de fonte não
   move nada — CLS zero no swap. */
@font-face {
  font-family: 'Manrope Fallback';
  src: local('Arial'), local('Helvetica Neue'), local('Helvetica');
  size-adjust: 103.05%;
  ascent-override: 103.44%;
  descent-override: 29.11%;
  line-gap-override: 0%;
}

/* O fundo é a página inteira: sem a margem padrão do body (borda branca em volta) e com
   o mesmo escuro no html — o rubber-band do iOS e a área fora do .arkdx pintam igual. */
html { background: #050607; }
body { margin: 0; min-height: 100dvh; background: #050607; color: #FAFAF7; }

.arkdx {
  --ark-fonte: 'Manrope', 'Manrope Fallback', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ark-branco: #FAFAF7;
  --ark-branco-corpo: rgba(250, 250, 247, 0.72);
  --ark-branco-mudo: rgba(250, 250, 247, 0.5);
  --ark-ouro: #B9915B;
  --ark-ouro-suave: #C9A84C;
  --ark-ouro-claro: #D9B878;
  --ark-tinta: #131315;
  --ark-erro: #FF8A80;
  --ark-vidro-borda: rgba(255, 255, 255, 0.14);
  --ark-vidro-fundo: rgba(255, 255, 255, 0.045);
  --ark-fora: cubic-bezier(0.23, 1, 0.32, 1);
  --ark-margem: max(24px, calc((100vw - 960px) / 2));

  position: relative;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #050607;
  color: var(--ark-branco);
  font-family: var(--ark-fonte);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.arkdx *, .arkdx *::before, .arkdx *::after { box-sizing: border-box; }
/* o #root é filho da coluna e precisa crescer com ela: é o que deixa a pergunta
   centrada verticalmente e a coluna do fechamento ocupar a tela */
.arkdx > #root { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
/* Perguntas: só a marca e a pergunta — sem selo, sem orbe. No celular o layout é
   ANCORADO NO TOPO (marca → linha do progresso → pergunta → campo), em posição fixa:
   nada se move quando o teclado abre ou a pergunta troca. */
.arkdx--perguntas { min-height: 100dvh; }
.arkdx--perguntas .arkdx__vaga { display: none; }

/* luz do capítulo escuro (mesma família da home): ouro no alto, aço-azul nos
   cantos baixos. Camada fixa e inerte — não repinta com a rolagem. */
.arkdx__luz {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(56% 22% at 50% 0%, rgba(185, 145, 91, 0.13) 0%, rgba(185, 145, 91, 0) 70%),
    radial-gradient(48% 30% at 88% 92%, rgba(24, 46, 82, 0.34) 0%, rgba(24, 46, 82, 0) 70%),
    radial-gradient(44% 26% at 8% 78%, rgba(24, 46, 82, 0.26) 0%, rgba(24, 46, 82, 0) 70%);
}
.arkdx__topo, .arkdx__cabeca, .arkdx__main { position: relative; z-index: 1; }

/* ── Topo: a logo como na hero, com a assinatura da holding embaixo; no
   mobile centrada ──────────────────────────────────────────────────────── */
.arkdx__topo {
  --logo-h: 26px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 38px var(--ark-margem) 0;
  /* acima da faixa do orbe (o canvas pinta depois no DOM) */
  z-index: 2;
}
.arkdx__marca {
  display: grid;
  /* centrada sob o logotipo, como no site */
  justify-items: center;
  gap: calc(var(--logo-h) * 0.27);
}
.arkdx__logo { height: var(--logo-h); width: auto; display: block; }
/* Assinatura da holding: MESMA receita do site (.arkom-hero-bilhon, em
   apps/landing/app/home/HeroOrbe.tsx) — caixa-alta tracked, sem itálico e sem
   travessão. Lá o tracking de 0,28em faz a assinatura tomar a largura do
   logotipo; aqui a logo é mais estreita (120px contra ~150px), então o corpo
   acompanha a altura da logo em vez de ser fixo em 10px. */
.arkdx__marca-sub {
  font-family: var(--ark-fonte);
  font-weight: 500;
  font-size: calc(var(--logo-h) * 0.335);
  line-height: 1;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  /* o tracking sobra à direita da última letra; o recuo devolve o eixo óptico */
  text-indent: 0.28em;
  color: rgba(250, 250, 247, 0.62);
  white-space: nowrap;
}
/* Selo de seleção: pílula de vidro com o ponto dourado que respira — o orbe em
   miniatura. Centrado na altura da logo no desktop; no mobile desce pra baixo da
   assinatura, centrado. Só na chegada e no fechamento (some durante as perguntas). */
.arkdx__vaga {
  --selo-h: 28px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: calc((var(--logo-h) - var(--selo-h)) / 2) 0 0;
  height: var(--selo-h);
  padding: 0 13px 0 11px;
  border-radius: 999px;
  border: 1px solid rgba(217, 184, 120, 0.32);
  background: rgba(185, 145, 91, 0.09);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  color: var(--ark-ouro-claro);
  font-size: 0.71875rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
  white-space: nowrap;
}
@media (max-width: 719px) {
  .arkdx__topo { --logo-h: 25px; flex-direction: column; align-items: center; gap: 16px; padding-top: 32px; }
  .arkdx__marca { justify-items: center; }
  .arkdx__vaga { margin: 0; }
}

/* ── Orbe flutuante no alto ────────────────────────────────────────────── */
.arkdx__cabeca { display: grid; }
/* pôster: o orbe já no primeiro paint (antes do JS), mesma geometria do canvas; some
   em crossfade quando o canvas pinta o 1º quadro */
.arkdx__orbe-poster {
  position: absolute;
  top: 0;
  left: 50%;
  height: 100%;
  width: auto;
  max-width: none;
  transform: translateX(-50%);
  opacity: 1;
  transition: opacity 700ms ease-out;
  pointer-events: none;
}
.arkdx__orbe--vivo .arkdx__orbe-poster { opacity: 0; }
.arkdx__orbe {
  position: relative;
  width: 100%;
  height: clamp(230px, 34svh, 330px);
  /* a faixa começa ABAIXO da assinatura: o canvas (anéis, estrelas) fica
     recortado nela e nunca passa por trás do texto da marca */
  margin-top: 10px;
  overflow: hidden;
}
@media (max-width: 719px) {
  /* no mobile a marca e o selo ficam em cima do orbe: ele ocupa o centro da tela
     (a esfera é 80% da altura da faixa) e respira da marca */
  .arkdx__orbe { height: clamp(180px, 25svh, 240px); margin-top: 14px; }
}

/* ── Coluna do formulário ──────────────────────────────────────────────── */
.arkdx__main {
  flex: 1 1 auto;
  display: flex;
  justify-content: center;
  padding: 0 20px clamp(40px, 8vh, 96px);
}
.arkdx__main--centro {
  align-items: center;
  padding-top: 8px;
  padding-bottom: 24px;
}
/* a pergunta ocupa um bloco de altura reservada (2 linhas de título + 2 de apoio):
   o campo fica no MESMO lugar em todas as perguntas */
.arkdx__main--centro .arkdx__texto { min-height: 178px; }
@media (min-width: 720px) {
  /* no desktop a caixa centrada tem altura fixa: Voltar e "Ainda não temos site" não
     empurram o campo pra cima e pra baixo entre perguntas */
  .arkdx__main--centro .arkdx__caixa { min-height: 480px; justify-content: flex-start; }
}
@media (max-width: 719px) {
  .arkdx__main--centro { align-items: flex-start; padding-top: 0; }
  .arkdx__main--centro .arkdx__progresso { margin-top: 18px; margin-bottom: 26px; }
  .arkdx__main--centro .arkdx__texto { min-height: 150px; }
}
.arkdx__caixa {
  width: 100%;
  max-width: 560px;
  display: flex;
  flex-direction: column;
}
/* fechamento com a agenda: a caixa alarga pro Cal mostrar mês + horários lado a lado */
.arkdx__caixa--larga { max-width: 1040px; }
.arkdx__caixa--larga .arkdx__ato { width: 100%; max-width: 560px; margin: 0 auto; }

/* progresso: fio de 1px com o ouro avançando; a contagem à direita */
.arkdx__progresso {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 14px;
  margin: 0 0 clamp(24px, 4vh, 36px);
}
.arkdx__fio {
  position: relative;
  height: 1px;
  background: rgba(250, 250, 247, 0.12);
  overflow: hidden;
}
.arkdx__fio > span {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  background: linear-gradient(90deg, var(--ark-ouro) 0%, var(--ark-ouro-claro) 100%);
  transition: transform 520ms var(--ark-fora);
}
.arkdx__contagem {
  margin: 0;
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  color: var(--ark-branco-mudo);
  white-space: nowrap;
}

.arkdx__passo { display: flex; flex-direction: column; }
.arkdx__texto { display: flex; flex-direction: column; }
@media (prefers-reduced-motion: no-preference) {
  /* movimento é complementar: texto, opções e atos já são legíveis no frame zero; o campo
     de texto é o mesmo nó entre perguntas (segura o teclado aberto) e não pisca */
  .arkdx__texto, .arkdx__ato { animation: arkdxEntra 320ms var(--ark-fora) backwards; }
  /* a chegada já vem pintada pelo HTML: sem fade, senão o LCP espera 320 ms de opacidade 0 */
  .arkdx__passo--inicial { animation: none; }
}
@keyframes arkdxEntra {
  from { transform: translateY(10px); }
  to { transform: none; }
}

.arkdx__pergunta {
  margin: 0 0 10px;
  text-align: center;
  font-family: var(--ark-fonte);
  font-weight: 600;
  font-size: clamp(1.35rem, 1.2vw + 1rem, 1.9rem);
  line-height: 1.3;
  letter-spacing: -0.02em;
  color: var(--ark-branco);
  text-wrap: balance;
}
.arkdx__pergunta--fim { font-size: clamp(1.2rem, 1vw + 0.9rem, 1.6rem); }

/* ── Chegada: tudo centrado — título grande, intro, 3 benefícios de UMA linha ──
   Escala medida em Manrope: título 28 px cabe em 328 px (360 − 2×16); benefício a
   13,5 px cabe em 300 px (328 − ícone 20 − gap 8). Bullet menor que a intro, de propósito. */
.arkdx__chegada { padding-top: clamp(6px, 1.5vh, 14px); align-items: center; text-align: center; }
.arkdx__pergunta--chegada {
  margin-bottom: 14px;
  font-size: clamp(1.75rem, 5.2vw + 0.5rem, 2.75rem);
  line-height: 1.12;
  letter-spacing: -0.025em;
}
.arkdx__intro {
  margin: 0 auto;
  max-width: 36ch;
  text-align: center;
  font-size: clamp(1.0625rem, 0.4vw + 0.95rem, 1.1875rem);
  line-height: 1.5;
  color: var(--ark-branco-corpo);
  text-wrap: pretty;
}
.arkdx__lista {
  list-style: none;
  margin: clamp(16px, 2.6vh, 24px) 0 0;
  padding: 0;
  width: 100%;
  display: grid;
  justify-items: center;
  gap: 11px;
}
.arkdx__lista li {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  max-width: 100%;
  font-size: clamp(0.84375rem, 0.3vw + 0.78rem, 0.9375rem);
  line-height: 1.4;
  font-weight: 500;
  letter-spacing: 0.005em;
  color: var(--ark-branco);
  text-align: center;
  text-wrap: pretty;
}
.arkdx__check {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1px solid rgba(217, 184, 120, 0.5);
  background: rgba(185, 145, 91, 0.14);
  color: var(--ark-ouro-claro);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.arkdx__check svg { width: 11px; height: 11px; }
/* o CTA desce: os textos ganham o centro da tela e o botão fecha a dobra */
/* Chegada: o campo do nome é a entrada (o botão saiu em 18/09). Respira mais que
   um campo do meio do fluxo, porque aqui ele é a única ação da tela. */
.arkdx__campo--chegada { margin-top: clamp(22px, 3.5vh, 38px); justify-items: stretch; gap: 10px; }
.arkdx__campo--chegada input { text-align: center; }
.arkdx__campo--chegada .arkdx__termos { margin-top: 2px; }
/* Aviso de gravação: substitui o texto que vivia dentro do botão de avanço, que
   saiu em 18/09. É a única espera de rede do fluxo (o portão do nome). */
.arkdx__gravando {
  margin: 12px 0 0;
  text-align: center;
  font-size: 0.8125rem;
  line-height: 1.4;
  color: var(--ark-branco-mudo);
}
/* a chegada fecha a dobra do celular: menos respiro embaixo que nas perguntas */
.arkdx--chegada .arkdx__main { padding-bottom: clamp(20px, 3vh, 40px); }
@media (max-width: 719px) {
  /* 16 px de margem lateral na chegada: é o que dá 300 px de texto ao benefício */
  .arkdx--chegada .arkdx__main { padding-left: 16px; padding-right: 16px; }
}
@media (min-width: 720px) {
  .arkdx__intro { max-width: 46ch; }
  .arkdx__lista { gap: 13px; }
  .arkdx__lista li { gap: 10px; }
  .arkdx__check { width: 22px; height: 22px; }
  .arkdx__check svg { width: 12px; height: 12px; }
}
.arkdx__ajuda {
  margin: 0 auto clamp(22px, 3.6vh, 30px);
  max-width: 46ch;
  text-align: center;
  font-size: 0.9375rem;
  line-height: 1.6;
  color: var(--ark-branco-corpo);
  text-wrap: pretty;
}

.arkdx__oculto {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ── Campo de texto: vidro escuro, foco dourado ────────────────────────── */
.arkdx__campo { display: grid; gap: 8px; }
.arkdx__campo input {
  width: 100%;
  height: 58px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid var(--ark-vidro-borda);
  background: var(--ark-vidro-fundo);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  color: var(--ark-branco);
  font-family: inherit;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: 0.005em;
  outline: none;
  transition: border-color 220ms var(--ark-fora), box-shadow 220ms var(--ark-fora), background-color 220ms var(--ark-fora);
  -webkit-appearance: none;
  appearance: none;
}
.arkdx__campo input::placeholder,
.arkdx__campo input::-webkit-input-placeholder {
  color: rgba(250, 250, 247, 0.38);
  -webkit-text-fill-color: rgba(250, 250, 247, 0.38);
  opacity: 1;
  font-weight: 400;
}
.arkdx__campo input:focus-visible {
  border-color: rgba(217, 184, 120, 0.75);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 0 4px rgba(185, 145, 91, 0.16);
}
.arkdx__campo input[aria-invalid='true'] { border-color: rgba(255, 138, 128, 0.7); }
.arkdx__campo input:-webkit-autofill,
.arkdx__campo input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--ark-branco);
  -webkit-box-shadow: 0 0 0 1000px #121316 inset;
  transition: background-color 9999s ease-out;
}

/* ── Opções: fileiras de vidro; a letra é o atalho no teclado ──────────── */
.arkdx__opcoes { display: grid; gap: 9px; }
.arkdx__opcao {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 58px;
  padding: 14px 18px;
  border-radius: 14px;
  border: 1px solid var(--ark-vidro-borda);
  background: var(--ark-vidro-fundo);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  color: var(--ark-branco);
  font-family: inherit;
  font-size: 1rem;
  line-height: 1.3;
  font-weight: 500;
  letter-spacing: 0.005em;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  transition: border-color 200ms var(--ark-fora), background-color 200ms var(--ark-fora), transform 140ms var(--ark-fora);
}
@media (hover: hover) and (pointer: fine) {
  .arkdx__opcao:hover {
    border-color: rgba(217, 184, 120, 0.55);
    background: rgba(185, 145, 91, 0.09);
  }
}
.arkdx__opcao:active { transform: scale(0.99); }
.arkdx__opcao:focus-visible { outline: 2px solid var(--ark-ouro-claro); outline-offset: 3px; }
.arkdx__opcao[aria-pressed='true'] {
  border-color: var(--ark-ouro);
  background: rgba(185, 145, 91, 0.16);
}
.arkdx__tecla {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.05);
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ark-branco-mudo);
  transition: background-color 200ms var(--ark-fora), color 200ms var(--ark-fora), border-color 200ms var(--ark-fora);
}
.arkdx__opcao[aria-pressed='true'] .arkdx__tecla,
.arkdx__opcao:hover .arkdx__tecla {
  border-color: transparent;
  background: var(--ark-ouro);
  color: var(--ark-tinta);
}
@media (hover: none) and (pointer: coarse) {
  .arkdx__tecla { display: none; }
}

/* segmento: 26 alternativas — busca em cima, malha de chips embaixo */
.arkdx__busca { margin-bottom: 12px; }
.arkdx__chips {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
@media (min-width: 720px) {
  .arkdx__chips { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.arkdx__chip {
  min-height: 50px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--ark-vidro-borda);
  background: var(--ark-vidro-fundo);
  color: var(--ark-branco);
  font-family: inherit;
  font-size: 0.9375rem;
  line-height: 1.25;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  transition: border-color 200ms var(--ark-fora), background-color 200ms var(--ark-fora), transform 140ms var(--ark-fora);
}
@media (hover: hover) and (pointer: fine) {
  .arkdx__chip:hover { border-color: rgba(217, 184, 120, 0.55); background: rgba(185, 145, 91, 0.09); }
}
.arkdx__chip:active { transform: scale(0.98); }
.arkdx__chip:focus-visible { outline: 2px solid var(--ark-ouro-claro); outline-offset: 3px; }
.arkdx__chip[aria-pressed='true'] { border-color: var(--ark-ouro); background: rgba(185, 145, 91, 0.16); }
.arkdx__chip--realce { border-color: rgba(217, 184, 120, 0.45); }
.arkdx__vazio {
  margin: 0;
  padding: 18px 0 6px;
  text-align: center;
  font-size: 0.9375rem;
  color: var(--ark-branco-mudo);
}

.arkdx__erro { margin: 0; font-size: 0.8125rem; line-height: 1.45; color: var(--ark-erro); }

/* consentimento afirmativo (chegada): clicar em Iniciar é o aceite — sem caixa */
.arkdx__termos {
  margin: 4px auto 0;
  max-width: 40ch;
  text-align: center;
  font-size: 0.78125rem;
  line-height: 1.5;
  color: var(--ark-branco-mudo);
  text-wrap: pretty;
}
.arkdx__termos a { color: var(--ark-branco-corpo); text-decoration: underline; text-underline-offset: 3px; }
.arkdx__termos a:hover, .arkdx__termos a:focus-visible { color: var(--ark-branco); }
.arkdx__termos a:focus-visible { outline: 2px solid var(--ark-ouro-claro); outline-offset: 2px; border-radius: 3px; }
.arkdx__banner {
  margin: 0 0 16px;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255, 138, 128, 0.4);
  background: rgba(255, 138, 128, 0.1);
  color: #FFD9D3;
  font-size: 0.875rem;
  line-height: 1.45;
}
.arkdx__selo--vivo { color: var(--ark-branco-corpo); border-color: rgba(250, 250, 247, 0.2); background: rgba(255, 255, 255, 0.04); }
.arkdx__ponto {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ark-ouro-claro);
  box-shadow: 0 0 0 0 rgba(217, 184, 120, 0.5);
  animation: arkdxRespira 1.4s ease-in-out infinite;
}
@keyframes arkdxRespira {
  0%, 100% { transform: scale(0.85); box-shadow: 0 0 0 0 rgba(217, 184, 120, 0.45); }
  50% { transform: scale(1); box-shadow: 0 0 0 6px rgba(217, 184, 120, 0); }
}
@media (prefers-reduced-motion: reduce) { .arkdx__ponto { animation: none; } }

/* ── Ações ─────────────────────────────────────────────────────────────── */
.arkdx__acoes {
  display: grid;
  justify-items: center;
  gap: 6px;
  margin-top: clamp(20px, 3.6vh, 28px);
}

/* CTA: a pílula de vidro fosco da home, que vira ouro no hover — com a
   cápsula circular e a seta que a home usa. Botão de verdade (submit). */
.arkdx__cta {
  --cap: 38px;
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: 100%;
  height: 56px;
  padding: 0 8px 0 26px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 38%, rgba(255, 255, 255, 0.03) 62%, rgba(255, 255, 255, 0.1) 100%);
  backdrop-filter: blur(24px) saturate(1.5);
  -webkit-backdrop-filter: blur(24px) saturate(1.5);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.28), inset 0 -1px 1px rgba(255, 255, 255, 0.08), 0 12px 32px rgba(0, 0, 0, 0.45);
  color: var(--ark-branco);
  font-family: inherit;
  font-weight: 600;
  font-size: 0.9375rem;
  letter-spacing: 0.01em;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
  transition: border-color 0.38s var(--ark-fora), box-shadow 0.38s ease-out, color 0.38s var(--ark-fora), transform 140ms ease-out;
}
@media (min-width: 720px) {
  .arkdx__cta { width: auto; min-width: 232px; }
}
.arkdx__cta::before {
  content: '';
  position: absolute;
  left: 10%;
  right: 10%;
  top: 8%;
  height: 46%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
  filter: blur(6px);
  pointer-events: none;
}
.arkdx__cta::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(146deg, #C9A053 0%, #B9915B 55%, #A8814E 100%);
  opacity: 0;
  transition: opacity 0.38s var(--ark-fora);
}
.arkdx__cta > * { position: relative; z-index: 1; }
.arkdx__cta:hover, .arkdx__cta:focus-visible {
  border-color: rgba(217, 184, 120, 0.6);
  color: var(--ark-tinta);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 12px 30px rgba(185, 145, 91, 0.24);
}
.arkdx__cta:hover::after, .arkdx__cta:focus-visible::after { opacity: 1; }
.arkdx__cta:focus-visible { outline: 2px solid var(--ark-ouro-claro); outline-offset: 3px; }
.arkdx__cta:active { transform: scale(0.98); }
.arkdx__cta:disabled { cursor: default; opacity: 0.6; }
.arkdx__cta:disabled:hover::after { opacity: 0; }
.arkdx__cta:disabled:hover { color: var(--ark-branco); }
.arkdx__capsula {
  display: grid;
  place-items: center;
  width: var(--cap);
  height: var(--cap);
  margin-left: auto;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: border-color 0.38s ease-out, background-color 0.38s ease-out, transform 0.38s var(--ark-fora);
}
.arkdx__cta:hover .arkdx__capsula, .arkdx__cta:focus-visible .arkdx__capsula {
  border-color: rgba(19, 19, 21, 0.35);
  background: rgba(19, 19, 21, 0.12);
  transform: translateX(2px);
}
.arkdx__capsula svg { display: block; }
@media (max-width: 719px) {
  .arkdx__cta { backdrop-filter: none; -webkit-backdrop-filter: none; }
}

/* segundo caminho (site) e voltar: texto, sem competir com a pílula */
.arkdx__pular {
  margin-top: 10px; /* respiro entre o "Continuar" e o "Ainda não temos site" */
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: transparent;
  color: var(--ark-branco-corpo);
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  touch-action: manipulation;
  transition: border-color 200ms var(--ark-fora), color 200ms var(--ark-fora), background-color 200ms var(--ark-fora);
}
.arkdx__pular:hover, .arkdx__pular:focus-visible {
  border-color: rgba(217, 184, 120, 0.5);

/* ── Revisão da ficha (09/11/2026): no celular, e-mail, todos os campos e os dois botões
   cabem numa tela, sem rolar. A ficha é UM registro de vidro (o vidro da pílula do CTA):
   o e-mail no topo, em ouro, e cada campo numa linha — rótulo e valor lado a lado, com a
