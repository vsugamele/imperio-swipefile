    <script>
        (function() {
            var CFG = window.PAGE_CONFIG || {};

            /* ----------------------------------------------------------------
               Link do botão + repasse de UTMs
               ---------------------------------------------------------------- */
            var ctaButton = document.querySelector('[data-cta]');
            if (ctaButton && CFG.CTA_URL) ctaButton.setAttribute('href', CFG.CTA_URL);

            /* os parâmetros da URL atual seguem para todos os links da página,
               sem sobrescrever o que o link já carrega (tracking do afiliado) */
            function repassarParametros() {
                var entrada = new URLSearchParams(location.search);
                if (!entrada.toString()) return;
                var links = document.querySelectorAll('a[href]');
                for (var i = 0; i < links.length; i++) {
                    var link = links[i];
                    if (!/^(https?:\/\/|\/)/.test(link.getAttribute('href'))) continue;
                    var destino = new URLSearchParams(link.search);
                    entrada.forEach(function(valor, chave) {
                        if (!destino.get(chave)) destino.set(chave, valor);
                    });
                    link.search = destino.toString();
                }
            }
            if (document.readyState !== 'loading') repassarParametros();
            else document.addEventListener('DOMContentLoaded', repassarParametros);
            /* links revelados depois do load também recebem os parâmetros */
            window.addEventListener('click', function(e) {
                var a = e.target && e.target.closest ? e.target.closest('a') : null;
                if (a) repassarParametros();
            }, true);

            /* ----------------------------------------------------------------
               Data de hoje na barra vermelha
               ---------------------------------------------------------------- */
            var hoje = new Date();
            var elData = document.getElementById('current-date');
            if (elData) {
                elData.textContent = String(hoje.getMonth() + 1).padStart(2, '0') + '/' +
                    String(hoje.getDate()).padStart(2, '0') + '/' + hoje.getFullYear();
            }

            /* ----------------------------------------------------------------
               Título da aba piscando
               ---------------------------------------------------------------- */
            var titulos = CFG.TAB_TITLES;
            if (titulos && titulos.length) {
                var iTitulo = 0;
                setInterval(function() {
                    document.title = titulos[iTitulo];
                    iTitulo = (iTitulo + 1) % titulos.length;
                }, 1000);
            }

            /* ----------------------------------------------------------------
               Toque/clique em qualquer lugar inicia o vídeo
               ---------------------------------------------------------------- */
            var jaClicou = false;

            function clicarNoMeio() {
                if (jaClicou) return;
                jaClicou = true;
                var x = window.innerWidth / 2,
                    y = window.innerHeight / 2;
                var alvo = document.elementFromPoint(x, y);
                if (alvo) alvo.click();
                document.dispatchEvent(new MouseEvent('click', {
                    view: window,
                    bubbles: true,
                    cancelable: true,
                    clientX: x,
                    clientY: y
                }));
            }
            document.addEventListener('touchstart', clicarNoMeio, {
                once: true
            });
            document.addEventListener('click', clicarNoMeio, {
                once: true
            });

            /* ----------------------------------------------------------------
               Gate do pitch: revela o CTA no segundo configurado
               ---------------------------------------------------------------- */
            var PITCH = parseInt(CFG.PITCH_SECONDS, 10) || 0;
            var wrap = document.querySelector('.dtc-cta-wrap');
            var cta = document.querySelector('.dtc-cta');
            var chaveRevelado = 'ctaRevelado' + PITCH;
            var revelado = false;

            function revelar() {
                if (revelado || !wrap) return;
                revelado = true;
                wrap.style.display = 'block';
                document.body.classList.add('dtc-revealed');
                try {
                    localStorage.setItem(chaveRevelado, 'true');
                } catch (e) {}
                /* desce só o necessário para o botão caber inteiro na tela */
                requestAnimationFrame(function() {
                    var falta = cta.getBoundingClientRect().bottom - window.innerHeight;
                    if (falta > 0) window.scrollBy({
                        top: falta + 16,
                        behavior: 'smooth'
                    });
                });
                iniciarContador();
            }

            /* quem já viu o pitch numa visita anterior vê o botão na hora */
            var jaViu = false;
            try {
                jaViu = localStorage.getItem(chaveRevelado) === 'true';
            } catch (e) {}

            if (jaViu) {
                setTimeout(revelar, 100);
            } else {
                var tentativas = 0;
                var inicio = Date.now();
                (function observarPlayer() {
                    var pronto = typeof smartplayer !== 'undefined' &&
                        smartplayer.instances && smartplayer.instances.length;
                    if (!pronto) {
                        /* player de outro provedor (ou lento): cai no tempo de página */
                        if (++tentativas > 12) {
                            /* conta do carregamento da página, não do fim das tentativas */
                            if (CFG.FALLBACK_TIMER) {
                                setTimeout(revelar, Math.max(0, PITCH * 1000 - (Date.now() - inicio)));
                            }
                            return;
                        }
                        return setTimeout(observarPlayer, 1000);
                    }
                    var player = smartplayer.instances[0];
                    player.on('timeupdate', function() {
                        if (revelado || player.smartAutoPlay) return;
                        if (player.video.currentTime < PITCH) return;
                        revelar();
                    });
                })();
            }

            /* ----------------------------------------------------------------
               "Only N spots left!" — começa a cair quando o CTA aparece,
               não no load da página
               ---------------------------------------------------------------- */
            function iniciarContador() {
                var alvo = document.querySelector('[data-spots-left]');
                if (!alvo) return;

                var INICIO = parseInt(CFG.SPOTS_START, 10) || 250;
                var PISO = parseInt(CFG.SPOTS_FLOOR, 10) || 9;
                var PARADA = 12; /* daqui para baixo as vagas se arrastam */
                var chave = 'spotsLeft' + INICIO;

                var restam = (function() {
                    try {
                        var salvo = parseInt(sessionStorage.getItem(chave), 10);
                        if (salvo >= PISO && salvo <= INICIO) return salvo;
                    } catch (e) {}
                    return INICIO;
                })();
                alvo.textContent = restam;

                function proximoDelay() {
                    var base;
                    if (restam > 120) base = 960;
                    else if (restam > 60) base = 1920;
                    else if (restam > PARADA) base = 3600;
                    else base = 25000 + (PARADA - restam) * 7000;
                    return base + Math.random() * base * 0.8;
                }

                function proximoPasso() {
                    if (restam > 120) return 3 + Math.floor(Math.random() * 3);
                    if (restam > 60) return 2 + Math.floor(Math.random() * 2);
                    if (restam > PARADA) return 1 + Math.floor(Math.random() * 2);
                    return 1;
                }

                function tick() {
                    if (restam <= PISO) return;
                    var passo = proximoPasso();
                    /* nunca pular o ponto de parada — as últimas vagas têm que ser vistas */
                    if (restam > PARADA && restam - passo < PARADA) passo = restam - PARADA;
                    restam = Math.max(PISO, restam - passo);
                    try {
                        sessionStorage.setItem(chave, restam);
                    } catch (e) {}
                    alvo.textContent = restam;
                    alvo.classList.remove('is-dropping');
                    void alvo.offsetWidth;
                    alvo.classList.add('is-dropping');
                    setTimeout(tick, proximoDelay());
                }
                setTimeout(tick, proximoDelay());
            }
        })();
